# Include block to be placed inside existing Nginx server block for robotech.nitk.ac.in
# Add to: /etc/nginx/sites-available/robotech (inside server { ... })

# Reverse Proxy for Django Application
location /proforma/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /proforma;
    proxy_redirect off;
    client_max_body_size 10M;
}

# Static Files
location /proforma/static/ {
    alias /var/www/robotech-proforma/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# Media Files (photos, QR codes)
location /proforma/media/ {
    alias /var/www/robotech-proforma/media/;
    expires 7d;
    add_header Cache-Control "public, no-transform";
}

# Protection: Deny direct access to generated PDF storage directory
location /proforma/media/pdfs/ {
    internal;
    return 403;
}
